# voice.conf — tuned F5-TTS synthesis parameters.
# Sourced (optionally) by jarvis_voice.sh and used by sweep.py's baked-in
# winner. These values came from a 13-variant sweep ranked by Resemblyzer
# speaker-similarity (JARVIS: 0.833 → 0.896).
#
#   speed        speaking rate (1.0 = neutral)
#   cfg_strength text adherence (lower = more natural variance)
#   nfe_step     diffusion refinement steps (higher = better, slower)
#   device       MUST be cpu on Apple Silicon (MPS shader cache segfaults)
#
SPEED="1.05"
CFG_STRENGTH="1.5"
NFE_STEP="32"
DEVICE="cpu"
MODEL="F5TTS_v1_Base"
